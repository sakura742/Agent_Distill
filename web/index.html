<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>法律咨询评估平台</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #fff;
    --border: #e5e7eb;
    --text: #1f2937;
    --sub: #6b7280;
    --accent: #4f46e5;
    --accent-light: #eef2ff;
    --accent-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
    --danger: #dc2626;
    --danger-light: #fef2f2;
    --green: #059669;
    --green-light: #ecfdf5;
    --green-gradient: linear-gradient(135deg, #059669 0%, #10b981 100%);
    --radius: 10px;
    --radius-sm: 6px;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }

  /* ── 顶栏 ── */
  .header {
    flex-shrink: 0;
    background: var(--accent-gradient);
    padding: 14px 28px; display: flex; align-items: center; justify-content: space-between;
    z-index: 10; box-shadow: 0 2px 8px rgba(79,70,229,.25);
  }
  .header h1 { font-size: 19px; font-weight: 700; color: #fff; letter-spacing: .5px; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .header button {
    padding: 7px 20px; border: 1px solid rgba(255,255,255,.35); border-radius: 20px;
    background: rgba(255,255,255,.15); cursor: pointer; font-size: 13px; font-weight: 500;
    color: #fff; transition: all .2s; backdrop-filter: blur(4px);
  }
  .header button:hover { background: rgba(255,255,255,.28); border-color: rgba(255,255,255,.6); }

  /* ── 中间自适应区域 ── */
  .middle { flex: 1 1 0; display: flex; flex-direction: column; min-height: 0; }

  .main { flex: 1 1 0; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; gap: 0; }
  .col { display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--card); min-height: 0; box-shadow: var(--shadow-sm); }
  .col:first-child { border-radius: 0; }
  .col:last-child { border-right: none; }
  .col-header {
    flex-shrink: 0;
    padding: 12px 18px; font-weight: 700; font-size: 14px; letter-spacing: .3px;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px;
    background: #fafbfc;
  }
  .col-header .badge {
    font-size: 10px; padding: 2px 10px; border-radius: 12px; font-weight: 600;
    background: var(--danger-light); color: var(--danger);
  }
  .col-header .badge.tuned {
    background: var(--green-light); color: var(--green);
  }
  .col-header .round-limit {
    font-size: 10px; color: var(--sub); margin-left: auto; font-weight: 400;
    background: #f3f4f6; padding: 2px 8px; border-radius: 10px;
  }
  .col-body {
    flex: 1 1 0; min-height: 0; overflow-y: auto;
    padding: 16px; display: flex; flex-direction: column; gap: 12px;
  }

  /* ── 历史面板 ── */
  .history-bar {
    flex-shrink: 0;
    border-top: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-sm);
  }
  .history-toggle {
    padding: 10px 18px; font-size: 13px; color: var(--sub); cursor: pointer; user-select: none;
    transition: color .2s; font-weight: 500;
  }
  .history-toggle:hover { color: var(--accent); }
  .history-panel {
    display: none;
    background: #fafbfc; border-top: 1px solid var(--border);
    padding: 14px 18px; font-size: 13px; max-height: 180px; overflow-y: auto;
  }
  .history-panel.open { display: block; }
  .history-panel .turn {
    margin-bottom: 10px; padding: 10px 12px; border-radius: var(--radius-sm);
    background: #fff; border: 1px solid var(--border);
  }
  .history-panel .turn:last-child { margin-bottom: 0; }
  .history-panel .role { font-weight: 700; font-size: 11px; color: var(--accent); margin-bottom: 4px; display: block; }

  /* ── 输入栏 ── */
  .input-bar {
    flex-shrink: 0;
    display: flex; gap: 10px; padding: 14px 28px;
    border-top: 1px solid var(--border); background: var(--card); box-shadow: var(--shadow-md);
  }
  .input-bar input {
    flex: 1; padding: 11px 16px; border: 1.5px solid var(--border);
    border-radius: 24px; font-size: 14px; outline: none; transition: all .2s;
    background: #f9fafb;
  }
  .input-bar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(79,70,229,.12); background: #fff; }
  .input-bar button {
    padding: 11px 28px; background: var(--accent-gradient); color: #fff;
    border: none; border-radius: 24px; cursor: pointer; font-size: 14px; font-weight: 600;
    transition: all .2s; box-shadow: 0 2px 8px rgba(79,70,229,.3);
  }
  .input-bar button:hover { transform: translateY(-1px); box-shadow: 0 4px 14px rgba(79,70,229,.4); }
  .input-bar button:disabled { opacity: .55; cursor: not-allowed; transform: none; box-shadow: none; }

  /* ── 消息气泡 ── */
  .msg {
    padding: 12px 15px; border-radius: var(--radius); font-size: 14px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word; animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg.user {
    background: var(--accent-light); align-self: flex-end; max-width: 85%;
    border: 1px solid #d4d0fc; color: #3730a3;
  }
  .msg.assistant {
    background: #fff; border: 1px solid var(--border); box-shadow: var(--shadow-sm);
  }
  .msg.thinking {
    background: #fafbfc; border: 1.5px dashed #d1d5db; color: var(--sub);
    display: flex; align-items: center; gap: 10px; font-size: 13px; animation: pulse 1.5s ease-in-out infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }

  /* ── 推理过程 ── */
  .reasoning-box {
    background: #fafbfc; border: 1px solid var(--border); border-radius: var(--radius);
    margin-bottom: 0; font-size: 13px; box-shadow: var(--shadow-sm); overflow: hidden;
  }
  .reasoning-box summary {
    padding: 10px 14px; cursor: pointer; color: var(--accent); font-weight: 600; user-select: none;
    transition: background .15s;
  }
  .reasoning-box summary:hover { background: var(--accent-light); }
  .reasoning-content { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 6px; }
  .reasoning-content .label {
    font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: .5px;
  }
  .reasoning-content .value { font-size: 13px; color: var(--text); margin-bottom: 6px; }

  /* ── 加载动画 ── */
  .loading { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; flex-shrink: 0; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── 其他 ── */
  .empty { color: var(--sub); text-align: center; margin-top: 60px; font-size: 14px; opacity: .6; }
  .session-id { font-size: 11px; color: rgba(255,255,255,.65); font-family: "SF Mono", "Cascadia Code", monospace; margin-top: 2px; display: block; }
</style>
</head>
<body>

<div class="header">
  <div>
    <h1>⚖️ 法律咨询评估平台</h1>
    <span class="session-id" id="sessionDisplay">未创建会话</span>
  </div>
  <div class="header-right">
    <span style="font-size:11px;color:rgba(255,255,255,.7);">上下文：最近 3 轮</span>
    <button onclick="newSession()">🔄 新建对话</button>
  </div>
</div>

<!-- 中间区域：两列 + 历史面板，自适应剩余高度 -->
<div class="middle">

  <div class="main">
    <div class="col" id="rawCol">
      <div class="col-header">
        📋 原始 Qwen-1.5B <span class="badge">无知识库</span>
        <span class="round-limit">最多 3 轮</span>
      </div>
      <div class="col-body" id="rawBody">
        <div class="empty">等待提问…</div>
      </div>
    </div>

    <div class="col" id="tunedCol">
      <div class="col-header">
        🧠 微调 Qwen-1.5B <span class="badge tuned">微调 + 知识库</span>
        <span class="round-limit">最多 3 轮</span>
      </div>
      <div class="col-body" id="tunedBody">
        <div class="empty">等待提问…</div>
      </div>
    </div>
  </div>

  <div class="history-bar" id="historyBar" style="display:none;">
    <div class="history-toggle" id="historyToggle" onclick="toggleHistory()">▼ 历史对话记录</div>
    <div class="history-panel" id="historyPanel"></div>
  </div>

</div>

<div class="input-bar">
  <input id="msgInput" type="text" placeholder="输入您的法律问题…" onkeydown="if(event.key==='Enter')send()" />
  <button id="sendBtn" onclick="send()">发送</button>
</div>

<script>
let sessionId = null;

function newSession() {
  fetch('/session/new', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      sessionId = data.session_id;
      document.getElementById('sessionDisplay').textContent = '会话: ' + sessionId;
      document.getElementById('rawBody').innerHTML = '<div class="empty">新会话已创建，请提问</div>';
      document.getElementById('tunedBody').innerHTML = '<div class="empty">新会话已创建，请提问</div>';
      document.getElementById('historyBar').style.display = 'none';
      document.getElementById('historyPanel').classList.remove('open');
      document.getElementById('historyPanel').innerHTML = '';
      document.getElementById('msgInput').focus();
    });
}

function send() {
  const input = document.getElementById('msgInput');
  const msg = input.value.trim();
  if (!msg || !sessionId) return;

  input.value = '';
  const btn = document.getElementById('sendBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="loading"></span>';

  // 在两列同时显示用户消息
  appendUserMsg(msg);

  // 在两列底部插入"思考中"占位符
  const rawThinking = appendThinkingMsg('rawBody');
  const tunedThinking = appendThinkingMsg('tunedBody');

  fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId, message: msg })
  })
    .then(r => {
      if (!r.ok) return r.json().then(e => { throw new Error(e.detail || '请求失败'); });
      return r.json();
    })
    .then(data => {
      // 移除"思考中"占位符
      rawThinking.remove();
      tunedThinking.remove();
      // 渲染真实回答
      appendAssistantMsg(data);
      loadHistory();
    })
    .catch(err => {
      rawThinking.remove();
      tunedThinking.remove();
      appendError(err.message);
    })
    .finally(() => {
      btn.disabled = false;
      btn.textContent = '发送';
      input.focus();
    });
}

function appendUserMsg(msg) {
  const rawBody = document.getElementById('rawBody');
  const tunedBody = document.getElementById('tunedBody');

  [rawBody, tunedBody].forEach(b => {
    if (b.querySelector('.empty')) b.innerHTML = '';
  });

  const userHtml = `<div class="msg user">${escapeHtml(msg)}</div>`;
  rawBody.insertAdjacentHTML('beforeend', userHtml);
  tunedBody.insertAdjacentHTML('beforeend', userHtml);

  scrollBoth();
}

function appendThinkingMsg(bodyId) {
  const body = document.getElementById(bodyId);
  if (body.querySelector('.empty')) body.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'msg thinking';
  el.innerHTML = '<span class="loading"></span> AI 正在思考中…';
  body.appendChild(el);
  scrollBoth();
  return el; // 返回引用，供后续 remove
}

function appendAssistantMsg(data) {
  const rawBody = document.getElementById('rawBody');
  const tunedBody = document.getElementById('tunedBody');

  // 右列：推理过程 + 回答
  const r = data.reasoning || {};
  const reasoningHtml = `
    <details class="reasoning-box" open>
      <summary>🔍 推理过程</summary>
      <div class="reasoning-content">
        <span class="label">思考</span><span class="value">${escapeHtml(r.thought || '(无)')}</span>
        <span class="label">工具</span><span class="value">${escapeHtml(r.tool || '(无)')}</span>
        <span class="label">检索词</span><span class="value">${escapeHtml(r.query || '(无)')}</span>
        <span class="label">法条片段</span><span class="value">${escapeHtml(r.law_snippet || '(无)')}</span>
      </div>
    </details>
    <div class="msg assistant">${escapeHtml(data.tuned_answer)}</div>
  `;
  tunedBody.insertAdjacentHTML('beforeend', reasoningHtml);

  // 左列：仅回答
  rawBody.insertAdjacentHTML('beforeend', `<div class="msg assistant">${escapeHtml(data.raw_answer)}</div>`);

  scrollBoth();
}

function appendError(msg) {
  const errHtml = `<div class="msg assistant" style="color:var(--danger);">❌ ${escapeHtml(msg)}</div>`;
  document.getElementById('rawBody').insertAdjacentHTML('beforeend', errHtml);
  document.getElementById('tunedBody').insertAdjacentHTML('beforeend', errHtml);
  scrollBoth();
}

function scrollBoth() {
  // 使用 requestAnimationFrame 确保 DOM 更新后再滚动
  requestAnimationFrame(() => {
    const raw = document.getElementById('rawBody');
    const tuned = document.getElementById('tunedBody');
    raw.scrollTop = raw.scrollHeight;
    tuned.scrollTop = tuned.scrollHeight;
  });
}

function loadHistory() {
  if (!sessionId) return;
  fetch(`/session/${sessionId}/history`)
    .then(r => r.json())
    .then(data => {
      const bar = document.getElementById('historyBar');
      const panel = document.getElementById('historyPanel');
      if (!data.history || data.history.length === 0) {
        bar.style.display = 'none';
        return;
      }
      bar.style.display = 'block';
      panel.innerHTML = data.history.map(h => `
        <div class="turn">
          <span class="role">${h.role === 'user' ? '🧑 用户' : '🤖 助手'}</span>
          <div>${escapeHtml(h.content.substring(0, 200))}${h.content.length > 200 ? '…' : ''}</div>
        </div>
      `).join('');
    });
}

function toggleHistory() {
  const panel = document.getElementById('historyPanel');
  const toggle = document.getElementById('historyToggle');
  panel.classList.toggle('open');
  toggle.textContent = panel.classList.contains('open') ? '▲ 历史对话记录' : '▼ 历史对话记录';
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 页面加载时自动创建会话
newSession();
</script>
</body>
</html>
