[project]
name = "agent-distill"
version = "0.1.0"
description = "Legal Agent distillation platform"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "accelerate>=1.13.0",
    "bitsandbytes>=0.49.2",
    "chromadb>=1.5.9",
    "langchain>=1.3.4",
    "langchain-community>=0.4.2",
    "langgraph>=1.0.0",
    "mcp>=1.27.2",
    "openai>=2.41.0",
    "peft>=0.19.1",
    "pymupdf>=1.27.2.3",
    "sentence-transformers>=5.5.1",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "torchaudio>=2.6.0",
    "transformers>=5.10.2",
    "trl>=1.5.1",
    "streamlit>=1.58.0",
    "langchain-huggingface>=1.2.2",
    "fastapi>=0.136.3",
    "uvicorn>=0.49.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchaudio = [
    { index = "pytorch-cu126", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
